name: CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
      - name: Check Python syntax
  run: |
    python -m py_compile python/api_test.py
    python -m py_compile python/ollama_test.py
    python -m py_compile python/prompt_examples.py
    python -m py_compile python/system_prompt_test.py

      - name: Build Docker image
        run: |
          docker build -t ai-agents-api:ci .
